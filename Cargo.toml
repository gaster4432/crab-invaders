[package]
name = "shell-shooter"
version = "0.3.0"
edition = "2021"
description = "A fast 2D arcade space shooter written in Rust"
homepage = "https://github.com/gaster4432/shell-shooter"
repository = "https://github.com/gaster4432/shell-shooter"
license = "MIT"
keywords = ["game", "arcade", "shooter", "macroquad"]
categories = ["games"]

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
